<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>So I'm suppose to survive - Playable</title>
  <style>
    body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial; padding: 24px; background:#111; color:#eee; }
    .center { max-width:900px; margin:0 auto; }
    header { text-align:center; margin-bottom:18px }
    button { background:#0ea5a4; border:none; color:#012; padding:10px 16px; border-radius:6px; cursor:pointer; font-weight:600 }
    .muted { color:#aaa; }
    #game { display:none; margin-top:18px; }
    #scene { background:#0f172a; padding:18px; border-radius:8px; margin-bottom:12px; min-height:80px }
    .choices button { display:block; margin:8px 0; width:100%; text-align:left }
    .status { background:#071024; padding:12px; border-radius:8px; margin-top:12px; font-size:14px }
    .big { font-size:18px; font-weight:700 }
    footer { margin-top:18px; color:#888; font-size:13px }
    .hidden { display:none }
  </style>
</head>
<body>
  <div class="center">
    <header>
      <h1>So I'm suppose to survive</h1>
      <p class="muted">A browser-playable conversion of the narrative engine. Press Start to play.</p>
      <button id="startBtn">Start Game</button>
    </header>

    <main id="game">
      <div id="scene"></div>
      <div class="choices" id="choices"></div>

      <div class="status" id="status">
        <div class="big">Stats</div>
        <div id="statsArea"></div>
        <div class="big" style="margin-top:8px">Flags</div>
        <div id="flagsArea"></div>
        <div class="big" style="margin-top:8px">Inventory</div>
        <div id="invArea"></div>
      </div>

      <div id="endingArea" class="hidden" style="margin-top:12px"></div>
    </main>

    <footer>
      Converted engine — decisions update state and lead to different endings. If you want UI changes or extra saves, tell me what to add next.
    </footer>
  </div>

  <script>
    // Ported Story Engine (from Python) into in-page JavaScript

    class StoryState {
      constructor(){
        this.stats = {
          nicole_trust: 50,
          ethan_hostility: 10,
          heroine_favor: 0,
          system_points: 100
        };
        this.flags = {
          engaged_to_nicole: false,
          saved_heroines: false,
          gala_clown_outfit: false,
          ethan_bankrupted: false
        };
        this.inventory = [];
      }
      modify_stat(name, value){
        if(this.stats.hasOwnProperty(name)){
          this.stats[name] = Math.max(0, Math.min(100, this.stats[name] + value));
          // console.log(`[Stat Change] ${name.toUpperCase()}: ${this.stats[name]} (${value>0?'+':''}${value})`);
        }
      }
      set_flag(name, status=true){
        this.flags[name] = status;
        // console.log(`[Flag] ${name} = ${status}`);
      }
    }

    class NarrativeNode {
      constructor(id, text, choices){ this.node_id = id; this.text = text; this.choices = choices; }
    }

    class StoryEngine {
      constructor(){
        this.state = new StoryState();
        this.nodes = {};
      }
      add_node(node){ this.nodes[node.node_id] = node; }

      play_node(node_id){
        const node = this.nodes[node_id];
        if(!node){
          this.showScene('End of narrative path reached.');
          return;
        }

        // Show warning
        if(this.state.stats.ethan_hostility >= 80){
          // append warning to text
          this.showScene('\n⚠️ [BUTTERFLY EFFECT WARNING]: Ethan Knight is actively hunting you!\n' + node.text);
        } else {
          this.showScene(node.text);
        }

        // update status panel
        this.renderStatus();

        if(!node.choices || node.choices.length === 0){
          this.evaluate_ending();
          return;
        }

        // show choices
        const choicesDiv = document.getElementById('choices');
        choicesDiv.innerHTML = '';
        node.choices.forEach((choice, idx) => {
          const btn = document.createElement('button');
          btn.textContent = choice.text;
          btn.addEventListener('click', () => {
            if(choice.effect) choice.effect(this.state);
            this.play_node(choice.next_node);
          });
          choicesDiv.appendChild(btn);
        });
      }

      showScene(text){
        const scene = document.getElementById('scene');
        scene.textContent = text;
      }

      renderStatus(){
        document.getElementById('statsArea').textContent =
          Object.entries(this.state.stats).map(([k,v])=>`${k}: ${v}`).join(' | ');
        document.getElementById('flagsArea').textContent =
          Object.entries(this.state.flags).map(([k,v])=>`${k}: ${v}`).join(' | ');
        document.getElementById('invArea').textContent = this.state.inventory.join(', ') || '(empty)';
      }

      evaluate_ending(){
        const area = document.getElementById('endingArea');
        area.classList.remove('hidden');
        const choicesDiv = document.getElementById('choices');
        choicesDiv.innerHTML = '';

        let text = '\n--- FINAL OUTCOME ---\n';
        if(this.state.flags.ethan_bankrupted && this.state.flags.engaged_to_nicole){
          text += '🏆 TRUE ENDING: Absolute Villain Supremacy! You neutralized Ethan Knight and built a power dynamic with Nicole.';
        } else if(this.state.flags.ethan_bankrupted){
          text += '🥈 ENDING: Solitary Rogue. You bankrupted Ethan, but without Nicole\'s backing, you live on the run.';
        } else {
          text += '☠️ GAME OVER: Total Plot Erasure! Ethan Knight overpowers you, and the Villain System terminates your existence.';
        }

        area.textContent = text;

        // Add restart button
        const restart = document.createElement('button');
        restart.textContent = 'Play Again';
        restart.style.marginTop = '12px';
        restart.addEventListener('click', ()=>{ location.reload(); });
        area.appendChild(document.createElement('div')).appendChild(restart);
      }
    }

    // ==========================================
    // NODES CONFIGURATION (effects ported)
    // ==========================================

    const engine = new StoryEngine();

    // Effects
    function accept_engagement_effect(state){
      state.set_flag('engaged_to_nicole', true);
      state.modify_stat('nicole_trust', +30);
      state.modify_stat('system_points', +50);
      state.inventory.push('Absolute Defense Card');
    }
    function refuse_engagement_effect(state){
      state.set_flag('engaged_to_nicole', false);
      state.modify_stat('nicole_trust', -40);
      state.modify_stat('ethan_hostility', +30);
    }
    function save_heroines_effect(state){
      state.set_flag('saved_heroines', true);
      state.modify_stat('heroine_favor', +40);
      state.modify_stat('ethan_hostility', +40);
    }
    function ignore_heroines_effect(state){
      state.set_flag('saved_heroines', false);
      state.modify_stat('system_points', +20);
    }
    function auction_clown_effect(state){
      state.set_flag('gala_clown_outfit', true);
      if(state.flags.engaged_to_nicole || state.stats.system_points >= 120){
        state.set_flag('ethan_bankrupted', true);
      } else {
        state.set_flag('ethan_bankrupted', false);
      }
    }
    function direct_fight_effect(state){
      if(state.inventory.includes('Absolute Defense Card')){
        state.set_flag('ethan_bankrupted', true);
      } else {
        state.set_flag('ethan_bankrupted', false);
      }
    }

    // Nodes
    engine.add_node(new NarrativeNode('act1_morning',
      "You wake up next to Nicole Rivers. The Villain System alerts you that she is pushing for an engagement to tie your families together.",
      [
        { text: 'Accept the engagement and use her family as a shield.', next_node: 'act2_heroines', effect: accept_engagement_effect },
        { text: 'Refuse and attempt to escape her grasp.', next_node: 'act2_heroines', effect: refuse_engagement_effect }
      ]
    ));

    engine.add_node(new NarrativeNode('act2_heroines',
      "You spot Wendy Taylor and Jessica Snow trapped in a dangerous situation. Ethan Knight is en route to rescue them.",
      [
        { text: 'Intervene using System Martial Arts to rescue them first.', next_node: 'act3_gala', effect: save_heroines_effect },
        { text: 'Ignore them and let Ethan Knight take the spotlight.', next_node: 'act3_gala', effect: ignore_heroines_effect }
      ]
    ));

    engine.add_node(new NarrativeNode('act3_gala',
      "It's the Investment Gala. Ethan Knight is preparing to make a bid that will give him total control of the city's economy.",
      [
        { text: "Dress as a 'clown' to reduce threat level and disrupt the auction.", next_node: 'ending', effect: auction_clown_effect },
        { text: 'Confront Ethan directly in martial combat.', next_node: 'ending', effect: direct_fight_effect }
      ]
    ));

    engine.add_node(new NarrativeNode('ending', '', []));

    // Wire Start button
    document.getElementById('startBtn').addEventListener('click', ()=>{
      document.getElementById('startBtn').style.display = 'none';
      document.getElementById('game').style.display = 'block';
      engine.play_node('act1_morning');
    });

  </script>
</body>
</html>
