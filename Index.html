<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>So I'm suppose to survive - Playable</title>
  <style>
    body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial; padding: 24px; background:#111; color:#eee; }
    .center { max-width:900px; margin:0 auto; }
    header { text-align:center; margin-bottom:18px }
    button { background:#0ea5a4; border:none; color:#012; padding:10px 16px; border-radius:6px; cursor:pointer; font-weight:600; transition:all 0.2s ease; }
    button:hover { background:#06a39d; transform:translateY(-2px); box-shadow:0 4px 12px rgba(14,165,164,0.3); }
    button:active { transform:translateY(0); }
    .muted { color:#aaa; }
    #game { display:none; margin-top:18px; }
    #progress { background:#1a1a2e; padding:12px; border-radius:6px; margin-bottom:12px; font-size:13px; color:#0ea5a4; font-weight:600; }
    #scene { background:#0f172a; padding:18px; border-radius:8px; margin-bottom:12px; min-height:80px; line-height:1.6; white-space:pre-wrap; word-wrap:break-word; }
    .choices { margin-bottom:12px; }
    .choices button { display:block; margin:8px 0; width:100%; text-align:left; padding:12px 16px; }
    .status { background:#071024; padding:12px; border-radius:8px; margin-top:12px; font-size:13px; }
    .big { font-size:16px; font-weight:700; margin-top:12px; color:#0ea5a4; }
    .big:first-child { margin-top:0; }
    .stat-row { padding:4px 0; display:flex; justify-content:space-between; }
    .stat-label { color:#aaa; }
    .stat-value { color:#0ea5a4; font-weight:600; }
    footer { margin-top:18px; color:#888; font-size:13px; }
    .hidden { display:none }
    #endingArea { margin-top:18px; padding:18px; border-radius:8px; background:#1a1a2e; border-left:4px solid #0ea5a4; }
    #endingArea.true-ending { border-left-color:#ffd700; background:rgba(255,215,0,0.05); }
    #endingArea.good-ending { border-left-color:#90ee90; background:rgba(144,238,144,0.05); }
    #endingArea.bad-ending { border-left-color:#ff6b6b; background:rgba(255,107,107,0.05); }
    #endingArea .ending-text { font-size:15px; line-height:1.6; margin-bottom:12px; }
  </style>
</head>
<body>
  <div class="center">
    <header>
      <h1>So I'm suppose to survive</h1>
      <p class="muted">A browser-playable conversion of the narrative engine. Press Start to play.</p>
      <button id="startBtn">Start Game</button>
    </header>

    <main id="game">
      <div id="progress"></div>
      <div id="scene"></div>
      <div class="choices" id="choices"></div>

      <div class="status" id="status">
        <div class="big">Stats</div>
        <div id="statsArea"></div>
        <div class="big">Flags</div>
        <div id="flagsArea"></div>
        <div class="big">Inventory</div>
        <div id="invArea"></div>
      </div>

      <div id="endingArea" class="hidden"></div>
    </main>

    <footer>
      Converted engine — decisions update state and lead to different endings. Make choices wisely.
    </footer>
  </div>

  <script>
    // Ported Story Engine (from Python) into in-page JavaScript

    class StoryState {
      constructor(){
        this.stats = {
          nicole_trust: 50,
          ethan_hostility: 10,
          heroine_favor: 0,
          system_points: 100
        };
        this.flags = {
          engaged_to_nicole: false,
          saved_heroines: false,
          gala_clown_outfit: false,
          ethan_bankrupted: false
        };
        this.inventory = [];
      }
      modify_stat(name, value){
        if(this.stats.hasOwnProperty(name)){
          const max = name === 'system_points' ? 150 : 100;
          this.stats[name] = Math.max(0, Math.min(max, this.stats[name] + value));
        }
      }
      set_flag(name, status=true){
        this.flags[name] = status;
      }
    }

    class NarrativeNode {
      constructor(id, text, choices, act = null){ 
        this.node_id = id; 
        this.text = text; 
        this.choices = choices;
        this.act = act;
      }
    }

    class StoryEngine {
      constructor(){
        this.state = new StoryState();
        this.nodes = {};
        this.current_act = 0;
      }
      add_node(node){ this.nodes[node.node_id] = node; }

      play_node(node_id){
        const node = this.nodes[node_id];
        if(!node){
          this.showScene('End of narrative path reached.');
          return;
        }

        // Update current act
        if(node.act) this.current_act = node.act;
        this.updateProgress();

        // Show warning if Ethan hostility is high
        let sceneText = node.text;
        if(this.state.stats.ethan_hostility >= 80){
          sceneText = '⚠️ [BUTTERFLY EFFECT WARNING]: Ethan Knight is actively hunting you!\n' + node.text;
        }
        this.showScene(sceneText);

        // update status panel
        this.renderStatus();

        if(!node.choices || node.choices.length === 0){
          this.evaluate_ending();
          return;
        }

        // show choices
        const choicesDiv = document.getElementById('choices');
        choicesDiv.innerHTML = '';
        node.choices.forEach((choice, idx) => {
          const btn = document.createElement('button');
          btn.textContent = choice.text;
          btn.addEventListener('click', () => {
            if(choice.effect) choice.effect(this.state);
            this.play_node(choice.next_node);
          });
          choicesDiv.appendChild(btn);
        });
      }

      updateProgress(){
        const acts = ['Act 1: Morning', 'Act 2: Crisis', 'Act 3: Gala', 'Finale'];
        document.getElementById('progress').textContent = `📍 ${acts[this.current_act] || 'Epilogue'}`;
      }

      showScene(text){
        const scene = document.getElementById('scene');
        scene.textContent = text;
      }

      renderStatus(){
        const statsArea = document.getElementById('statsArea');
        statsArea.innerHTML = Object.entries(this.state.stats).map(([k,v])=>
          `<div class="stat-row"><span class="stat-label">${k}:</span><span class="stat-value">${v}</span></div>`
        ).join('');
        
        const flagsArea = document.getElementById('flagsArea');
        flagsArea.innerHTML = Object.entries(this.state.flags).map(([k,v])=>
          `<div class="stat-row"><span class="stat-label">${k}:</span><span class="stat-value">${v ? '✓' : '✗'}</span></div>`
        ).join('');
        
        document.getElementById('invArea').textContent = this.state.inventory.length > 0 
          ? this.state.inventory.join(', ') 
          : '(empty)';
      }

      evaluate_ending(){
        const area = document.getElementById('endingArea');
        area.classList.remove('hidden', 'true-ending', 'good-ending', 'bad-ending');
        const choicesDiv = document.getElementById('choices');
        choicesDiv.innerHTML = '';

        let text = '';
        let className = 'bad-ending';

        if(this.state.flags.ethan_bankrupted && this.state.flags.engaged_to_nicole){
          text = '🏆 TRUE ENDING: Absolute Villain Supremacy\n\nYou have neutralized Ethan Knight and built an unshakeable power dynamic with Nicole Rivers. The city bows before you. The Villain System declares victory.';
          className = 'true-ending';
        } else if(this.state.flags.ethan_bankrupted){
          text = '🥈 ENDING: Solitary Rogue\n\nYou bankrupted Ethan and survived the gala, but without Nicole\'s backing, you live perpetually on the run. Victory tastes like exile.';
          className = 'good-ending';
        } else {
          text = '☠️ GAME OVER: Total Plot Erasure\n\nEthan Knight overpowers you. The Villain System terminates your existence. Your story ends here.';
          className = 'bad-ending';
        }

        area.classList.add(className);
        const endingText = document.createElement('div');
        endingText.className = 'ending-text';
        endingText.textContent = text;
        area.appendChild(endingText);

        // Add restart button
        const restart = document.createElement('button');
        restart.textContent = 'Play Again';
        restart.addEventListener('click', ()=>{ location.reload(); });
        area.appendChild(restart);
      }
    }

    // ==========================================
    // NODES CONFIGURATION (effects ported)
    // ==========================================

    const engine = new StoryEngine();

    // Effects
    function accept_engagement_effect(state){
      state.set_flag('engaged_to_nicole', true);
      state.modify_stat('nicole_trust', +30);
      state.modify_stat('system_points', +50);
      state.inventory.push('Absolute Defense Card');
    }
    function refuse_engagement_effect(state){
      state.set_flag('engaged_to_nicole', false);
      state.modify_stat('nicole_trust', -40);
      state.modify_stat('ethan_hostility', +30);
    }
    function save_heroines_effect(state){
      state.set_flag('saved_heroines', true);
      state.modify_stat('heroine_favor', +40);
      state.modify_stat('ethan_hostility', +40);
    }
    function ignore_heroines_effect(state){
      state.set_flag('saved_heroines', false);
      state.modify_stat('system_points', +20);
    }
    function auction_clown_effect(state){
      state.set_flag('gala_clown_outfit', true);
      if(state.flags.engaged_to_nicole || state.stats.system_points >= 120){
        state.set_flag('ethan_bankrupted', true);
      } else {
        state.set_flag('ethan_bankrupted', false);
      }
    }
    function direct_fight_effect(state){
      if(state.inventory.includes('Absolute Defense Card')){
        state.set_flag('ethan_bankrupted', true);
      } else {
        state.set_flag('ethan_bankrupted', false);
      }
    }

    // Nodes
    engine.add_node(new NarrativeNode('act1_morning',
      "You wake up next to Nicole Rivers. The Villain System alerts you that she is pushing for an engagement to tie your families together.",
      [
        { text: 'Accept the engagement and use her family as a shield.', next_node: 'act2_heroines', effect: accept_engagement_effect },
        { text: 'Refuse and attempt to escape her grasp.', next_node: 'act2_heroines', effect: refuse_engagement_effect }
      ],
      0
    ));

    engine.add_node(new NarrativeNode('act2_heroines',
      "You spot Wendy Taylor and Jessica Snow trapped in a dangerous situation. Ethan Knight is en route to rescue them.",
      [
        { text: 'Intervene using System Martial Arts to rescue them first.', next_node: 'act3_gala', effect: save_heroines_effect },
        { text: 'Ignore them and let Ethan Knight take the spotlight.', next_node: 'act3_gala', effect: ignore_heroines_effect }
      ],
      1
    ));

    engine.add_node(new NarrativeNode('act3_gala',
      "It's the Investment Gala. Ethan Knight is preparing to make a bid that will give him total control of the city's economy.",
      [
        { text: "Dress as a 'clown' to reduce threat level and disrupt the auction.", next_node: 'ending', effect: auction_clown_effect },
        { text: 'Confront Ethan directly in martial combat.', next_node: 'ending', effect: direct_fight_effect }
      ],
      2
    ));

    engine.add_node(new NarrativeNode('ending', '', [], 3));

    // Wire Start button
    document.getElementById('startBtn').addEventListener('click', ()=>{
      document.getElementById('startBtn').style.display = 'none';
      document.getElementById('game').style.display = 'block';
      engine.play_node('act1_morning');
    });

  </script>
</body>
</html>
